<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#263e35">
<title>上帝扔骰子 · 微光镇</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<main class="game">
<header class="topbar">
  <a class="title" href="./" aria-label="微光镇"><span class="emblem" aria-hidden="true">⚄</span><div><h1>微光镇</h1><p>上帝扔骰子</p></div></a>
  <div class="clock"><span id="skyIcon" aria-hidden="true">☀</span><p id="clock" aria-live="off"></p></div>
  <div class="top-actions">
    <button id="sound" aria-pressed="false" aria-label="开启音效" title="开启音效">♪</button>
    <button id="openPaper">日报 <span id="paperDot" class="dot" hidden></span></button>
    <button id="openFate">命运簿 <span id="fateDot" class="dot" hidden></span></button>
    <button id="openJournal">小镇手记 <span id="unread" hidden></span></button>
  </div>
</header>
<section class="playfield" aria-label="小镇地图">
  <div class="map-stage">
    <div class="map-frame">
      <canvas id="map" width="960" height="620" tabindex="0" aria-label="微光镇地图，方向键移动，加减键缩放，0 键回到全镇"></canvas>
      <div class="map-top">
        <p class="map-hint" id="mapHint">点击居民打开档案</p>
      </div>
      <div class="map-camera" role="group" aria-label="地图缩放">
        <button id="zoomOut" aria-label="缩小地图" title="缩小地图">−</button>
        <button id="zoomReset" aria-label="回到全镇" title="回到全镇">100%</button>
        <button id="zoomIn" aria-label="放大地图" title="放大地图">＋</button>
      </div>
      <button id="openSchool" class="school-entry" aria-label="查看学校日常">学校 ›</button>
      <button id="openRail" class="rail-entry" aria-label="查看列车时刻">列车 ›</button>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
  </div>
  <aside class="controls-panel" aria-label="小镇操作">
    <div class="time-controls" aria-label="地图与时间控制">
      <button id="homeView" aria-pressed="true" title="切换全镇建筑剖面">屋内</button>
      <button id="auto" aria-pressed="false" aria-label="继续时间" title="继续时间">▶</button>
      <button id="speed" aria-label="切换速度" title="切换速度">1×</button>
      <button id="step" aria-label="推进半小时" title="推进半小时">▸|</button>
      <button id="toNight" aria-label="推进到今天午夜" title="推进到今天午夜（结算日报）">到午夜</button>
    </div>
    <div class="side-tabs" role="tablist" aria-label="小镇玩法">
      <button id="side-fate" role="tab" aria-selected="true" aria-controls="sideFate">命运</button>
      <button id="side-economy" role="tab" aria-selected="false" aria-controls="sideEconomy" tabindex="-1">经营</button>
      <button id="side-town" role="tab" aria-selected="false" aria-controls="sideTown" tabindex="-1">镇上</button>
    </div>
    <section id="buildPlacement" class="build-placement" hidden aria-label="选择施工地块"></section>
    <section class="side-content side-fate" id="sideFate" role="tabpanel" aria-labelledby="side-fate">
      <div class="resident">
        <canvas id="portrait" width="64" height="64" aria-hidden="true"></canvas>
        <div><label class="sr-only" for="person">选择居民</label><select id="person"></select><p id="bio"></p></div>
        <button id="openWish" class="profile-link">档案 <span aria-hidden="true">›</span></button>
      </div>
      <section class="fate-actions" aria-labelledby="fateHeading">
        <div class="fate-head"><h2 id="fateHeading">拨动命运</h2><p id="tokens"></p></div>
        <div class="cards" aria-label="选择一次干预">
          <button data-kind="coin"><span aria-hidden="true">◉</span>捡到硬币</button>
          <button data-kind="lottery"><span aria-hidden="true">券</span>中彩票</button>
          <button data-kind="bus"><span aria-hidden="true">↗</span>赶上公交</button>
          <button data-kind="lost"><span aria-hidden="true">◇</span>丢失钥匙</button>
          <button data-kind="delay" title="适用于尚未出发的班车乘客"><span aria-hidden="true">◷</span>错过班车</button>
          <button id="redirect" aria-expanded="false" aria-controls="destinations"><span aria-hidden="true">⌖</span>改道</button>
        </div>
        <div id="destinations" class="destinations" hidden></div>
      </section>
      <section id="follow" class="follow" aria-label="干预后续" aria-live="polite" hidden></section>
      <div class="fate-tools">
        <button id="quests" class="side-link"><strong>今日委托</strong><small id="questProgress"></small></button>
        <button id="awareness" class="side-link awareness" title="干预越频繁、越容易被看见，察觉度就越高">
          <strong>小镇察觉度</strong><small id="awarenessText"></small>
        </button>
      </div>
    </section>
    <section class="side-content" id="sideEconomy" role="tabpanel" aria-labelledby="side-economy" hidden>
      <div class="town-balance"><span>居民 <strong id="townPopulation"></strong></span><span>公款 <strong id="townFunds"></strong></span></div>
      <button id="openBuild" class="side-link"></button>
      <button id="openSupply" class="side-link"></button>
    </section>
    <section class="side-content" id="sideTown" role="tabpanel" aria-labelledby="side-town" hidden>
      <button id="mapStory" class="side-link" hidden><strong id="mapStoryLabel"></strong><small id="mapStoryText"></small></button>
      <button id="openTwilight" class="side-link"></button>
      <button id="openStories" class="side-link"><strong>镇务告示</strong><small id="storyButtonDetail"></small></button>
      <section id="residentWatch" class="resident-watch" aria-label="关注的居民" hidden></section>
    </section>
  </aside>
</section>
<dialog id="build" aria-labelledby="buildTitle">
  <div class="journal-head"><h2 id="buildTitle" tabindex="-1">小镇建设</h2><button id="closeBuild" aria-label="关闭小镇建设">×</button></div>
  <div id="buildPanel" class="story-panel"></div>
</dialog>
<dialog id="supply" aria-labelledby="supplyTitle">
  <div class="journal-head"><h2 id="supplyTitle" tabindex="-1">今天的面包</h2><button id="closeSupply" aria-label="关闭面包生产">×</button></div>
  <div id="supplyPanel" class="story-panel"></div>
</dialog>
<dialog id="twilight" aria-labelledby="twilightTitle">
  <div class="journal-head"><h2 id="twilightTitle" tabindex="-1">河畔灯笺</h2><button id="closeTwilight" aria-label="关闭河畔灯笺">×</button></div>
  <div id="twilightPanel" class="story-panel twilight-panel"></div>
</dialog>
<dialog id="wish" aria-labelledby="wishTitle">
  <div class="journal-head"><h2 id="wishTitle" tabindex="-1">人物档案</h2><button id="closeWish" aria-label="关闭人物档案">×</button></div>
  <div id="wishPanel" class="story-panel"></div>
</dialog>
<dialog id="rail" aria-labelledby="railTitle">
  <div class="journal-head"><h2 id="railTitle">微光镇车站</h2><button id="closeRail" aria-label="关闭列车时刻">×</button></div>
  <div id="railPanel" class="story-panel"></div>
</dialog>
<dialog id="moment" aria-labelledby="momentTitle">
  <div class="journal-head"><h2 id="momentTitle">小镇偶遇</h2><button id="closeMoment" aria-label="关闭偶遇">×</button></div>
  <div id="momentPanel" class="story-panel"></div>
</dialog>
<dialog id="stories" aria-labelledby="storiesTitle">
  <div class="journal-head"><h2 id="storiesTitle">镇务告示</h2><button id="closeStories" aria-label="关闭镇务">×</button></div>
  <div id="storyPanel" class="story-panel"></div>
</dialog>
<dialog id="paper" class="paper-dialog" aria-labelledby="paperTitle">
  <div class="journal-head"><h2 id="paperTitle">微光镇日报</h2><button id="closePaper" aria-label="关闭日报">×</button></div>
  <div id="paperPanel" class="paper"></div>
</dialog>
<dialog id="fate" aria-labelledby="fateTitle">
  <div class="journal-head"><h2 id="fateTitle">命运簿</h2><button id="closeFate" aria-label="关闭命运簿">×</button></div>
  <div class="fate-tabs" role="tablist" aria-label="命运簿分类">
    <button role="tab" data-tab="quests">委托</button><button role="tab" data-tab="badges">成就</button><button role="tab" data-tab="newton">Newton 的笔记</button><button role="tab" data-tab="rewind">时光回溯</button>
  </div>
  <div id="fatePanel" class="story-panel"></div>
</dialog>
<dialog id="thread" aria-labelledby="threadTitle">
  <div class="journal-head"><h2 id="threadTitle">命运之线</h2><button id="closeThread" aria-label="关闭因果链">×</button></div>
  <div id="threadPanel" class="story-panel"></div>
</dialog>
<dialog id="journal" aria-labelledby="journalTitle">
  <div class="journal-head"><h2 id="journalTitle">小镇手记</h2><button id="closeJournal" aria-label="关闭手记">×</button></div>
  <div class="journal-body">
    <section><h3>镇上的事</h3><p id="notice" role="status"></p><ol id="events"></ol></section>
    <section><h3 id="memoryTitle">居民记忆</h3><div id="connections" class="connections" aria-label="这位居民对他人的信任" hidden></div><ul id="memories"></ul></section>
  </div>
  <div class="save-controls"><button id="export">导出存档</button><button id="importButton">导入存档</button><input id="import" type="file" accept="application/json,.json" hidden><label><input id="offline" type="checkbox"> 离线推进</label></div>
</dialog>
</main>
<script src="npc-memory.js"></script><script src="save-manager.js?v=2"></script><script src="town-school.js?v=2"></script><script src="town-stories.js?v=5"></script><script src="town-routines.js?v=15"></script><script src="town-moments.js?v=2"></script><script src="town-visitors.js?v=1"></script><script src="town-rail.js?v=1"></script><script src="town-wishes.js?v=2"></script><script src="town-relations.js"></script><script src="town-ripples.js?v=3"></script><script src="town-skeptic.js?v=1"></script><script src="town-goals.js?v=2"></script><script src="town-watch.js?v=3"></script><script src="town-twilight.js?v=1"></script><script src="town-paper.js?v=6"></script><script src="town-supply.js?v=2"></script><script src="town-build.js?v=1"></script><script src="world.js?v=17"></script><script src="town-homes.js?v=6"></script><script src="town-interiors.js?v=3"></script><script src="town-trade-art.js?v=2"></script><script src="town-art.js?v=9"></script><script src="town-atmosphere.js?v=1"></script><script src="town-camera.js?v=1"></script><script src="town-build-art.js?v=1"></script><script src="town-map.js?v=16"></script><script src="town-movement.js?v=11"></script><script src="town-cards.js?v=1"></script><script src="ui.js?v=20"></script>
</body></html>
