<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上帝扔骰子 · 微光镇</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
<header class="masthead">
  <div class="identity"><span class="dice" aria-hidden="true">⚄</span><div><p>微光镇</p><h1>上帝扔骰子</h1></div></div>
  <div class="timebar"><p id="clock" aria-live="polite"></p><button id="sound" aria-pressed="false">开启音效</button></div>
</header>
<div class="workspace">
<section class="scene" aria-label="小镇地图">
  <div class="map-frame"><canvas id="map" width="960" height="620" aria-label="微光镇地图，点击居民所在区域查看居民"></canvas><div class="map-key"><span></span> 点击地图查看居民</div></div>
  <div class="scene-controls"><span>小镇时间</span><button id="step">推进半小时</button><button id="auto" aria-pressed="false">自动推进</button></div>
</section>
<aside class="controls" aria-label="拨动命运">
  <div class="panel-head"><h2>拨动命运</h2><p id="tokens"></p></div>
  <div class="resident">
    <div id="portrait" aria-hidden="true"></div>
    <div><label for="person">观察居民</label><select id="person"></select><p id="bio"></p></div>
  </div>
  <div class="actions">
    <button data-kind="delay"><span aria-hidden="true">◷</span>错过班车</button>
    <button data-kind="lost"><span aria-hidden="true">◇</span>丢失钥匙</button>
    <button data-kind="coin"><span aria-hidden="true">◉</span>捡到硬币</button>
    <button data-kind="bus"><span aria-hidden="true">↗</span>赶上公交</button>
    <button data-kind="lottery"><span aria-hidden="true">✦</span>中彩票</button>
  </div>
  <div class="redirect"><label for="place">改道去</label><select id="place"></select><button data-kind="visit">改变去处</button></div>
  <section class="memory"><h3>居民记忆</h3><ul id="memories"></ul></section>
</aside>
</div>
<section class="timeline">
  <div class="panel-head"><h2>镇上的事</h2><p id="notice" aria-live="polite"></p></div>
  <ol id="events"></ol>
  <div class="save-controls"><button id="export">导出存档</button><label class="import">导入存档 <input id="import" type="file" accept="application/json,.json"></label><label><input id="offline" type="checkbox"> 离线推进</label></div>
</section>
</main>
<script src="npc-memory.js"></script><script src="save-manager.js"></script><script src="world.js"></script><script src="town-map.js"></script><script src="ui.js"></script>
</body></html>
